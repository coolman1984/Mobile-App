# Builds and tests the owner app. This repository had no CI of its own (the old workflow lived in the Apps-Factory monorepo), so until
# this runs green nothing from M05 on has been compiled by Gradle. Debug build only: no signing key, no secret, no release.
name: android
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
      - name: Commit the exported Room schema when it changed
        if: success() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas
          if ! git diff --cached --quiet; then
            git commit -m "Room: commit the exported schema [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-plus-owner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore
      - name: Short failure summary
        if: failure()
        shell: bash
        run: |
          echo "=== compile errors / failed tasks ==="
          grep -E "^e: |: error:|FAILED$|What went wrong" -A2 build.log | head -80 || true
          echo "=== failed tests ==="
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      n += 1
                      msg = (bad.get('message') or '')[:400].replace('\n', ' ')
                      print(case.get('classname') + '.' + case.get('name') + ' :: ' + msg)
                      if n >= 40: raise SystemExit
          print('failed tests listed:', n)
          PY
